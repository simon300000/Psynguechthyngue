name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Swift, Go, peer interoperability, licenses, and simulator verification
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Go from GoCore when present
        if: ${{ hashFiles('GoCore/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: GoCore/go.mod
          cache: false

      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version

      - name: Verify repository
        run: bash Scripts/verify.sh

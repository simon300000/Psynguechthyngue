name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Swift, GoBridge, licenses, iOS builds and UI tests
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go (GoBridge/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: GoBridge/go.mod
          cache-dependency-path: GoBridge/go.sum

      - name: Install xcodeproj gem
        run: gem install --user-install xcodeproj && echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          go version

      - name: Verify repository
        run: make verify

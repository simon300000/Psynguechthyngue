name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Swift, GoBridge, licenses, iOS builds and UI tests
    # The app calls iOS 27 APIs (behind #available), so it needs the Xcode 27
    # SDK; the macos-26 images stop at Xcode 26.x.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go (GoBridge/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: GoBridge/go.mod
          cache-dependency-path: GoBridge/go.sum

      # Pinned: the committed project is compared byte-for-byte with the
      # generator output, and other xcodeproj versions serialize differently.
      - name: Install xcodeproj gem
        run: gem install --user-install xcodeproj -v 1.23.0 && echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          go version
          ruby -e 'gem "xcodeproj", "1.23.0"; require "xcodeproj"; puts "xcodeproj #{Xcodeproj::VERSION}"'

      - name: Verify repository
        run: make verify
